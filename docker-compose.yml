# ============================================================================
# OpenHarness_HyperFrames — Monorepo Docker Compose
# Build context = repo root. Framework source lives in ./OpenHarness/,
# backend service lives in ./service/ (siblings). Only hyperframes_github_skills/
# and docker/ are baked into the image at build time (see Dockerfile); the
# framework source (src/ohmo/frontend) and the backend (service/) are
# mounted at runtime.
# ============================================================================
# 使用方法：
#
#   ―― CLI / 交互终端 ――
#   docker compose run --rm shell                          # 单独进入 bash 终端（不映射端口，与其他服务无冲突）
#   docker compose run --rm --service-ports shell          # 进入 bash 终端并映射 3000-3003（需 session 未占用该端口）
#   docker compose run --rm openharness --version          # 运行 oh 子命令
#   docker compose run --rm --service-ports openharness    # 交互式 oh（显示 --help）
#
#   ―― 后端服务（启动时自动 alembic 迁移，自动拉起 postgres/redis）――
#   docker compose up -d api                               # 视频服务 :8000（uvicorn + celery worker/beat）
#   docker compose up -d session                           # 交互会话服务 :8001（另占 3000-3003 preview 端口）
#
#   ―― 前端（独立 nginx 镜像，同源反代后端）――
#   docker compose up -d web                               # 视频服务前端 http://localhost:5173（反代 api+session）
#   docker compose up -d session-frontend                  # 会话前端   http://localhost:5174（反代 session）
#
#   ―― 组合 ――
#   docker compose up -d api session web session-frontend  # 后端 + 双前端一键全拉起
#   docker compose logs -f session                         # 追服务日志
#   docker compose down                                    # 停止并移除容器（数据卷保留）
#
#   注：宿主机端口 3000-3003 优先归 session；openharness/shell 以
#   --service-ports 方式启动时与 session 互斥，二选一。
#
# API Key 配置：
#   创建 .env 文件（基于 .env.example）：
#     ANTHROPIC_API_KEY=sk-ant-xxx
#     OPENAI_API_KEY=sk-xxx
#     OH_CORS_ORIGINS=http://localhost:5173   # 前端 dev 地址（生产填写真实域名）
# ============================================================================

services:
  openharness:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: "3.11"
        UV_VERSION: "0.7.3"
    image: openharness_hyperframes_qwen-tts_pptx:${OH_VERSION_HYPERFRAMES_VERSION:-v0.1.9_v0.7.77_v1.4_v2.1}
    container_name: openharness
    environment:
      - PYTHONUNBUFFERED=1
      - WATCHFILES_FORCE_POLLING=true
      - PRODUCER_HEADLESS_SHELL_PATH=/opt/chrome-headless-shell-linux64/chrome-headless-shell
      - CHROME_HEADLESS_BIN=/opt/chrome-headless-shell-linux64/chrome-headless-shell
      - OPENHARNESS_PERMISSION_MODE=full_auto
      - HYPERFRAMES_AUTO_UPDATE=false
      - HYPERFRAMES_NO_AUTO_INSTALL=1
      - HYPERFRAMES_NO_UPDATE_CHECK=1
      # API Keys — 通过 .env 文件传入
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # QwenTTS (本地 TTS 服务，Base 声音克隆) — 通过 .env 文件传入
      - QWENTTS_URL=${QWENTTS_URL:-}
      - QWENTTS_REF_AUDIO=${QWENTTS_REF_AUDIO:-}
      - QWENTTS_REF_TEXT=${QWENTTS_REF_TEXT:-}
      - QWENTTS_VOICE=${QWENTTS_VOICE:-}
      - QWENTTS_CLONE_SCRIPT=${QWENTTS_CLONE_SCRIPT:-}
    volumes:
      # 框架源码挂载（OpenHarness/ 子目录）— 修改宿主机代码，容器内立即生效
      # PYTHONPATH=/app/src 使 Python 优先从这里导入，覆盖 pip 安装的版本
      - ./OpenHarness/src:/app/src
      - ./OpenHarness/ohmo:/app/ohmo
      # 前端源码挂载 — React TUI 的 dev 布局查找路径为 /app/frontend/terminal/
      - ./OpenHarness/frontend:/app/frontend
      # 持久化配置和会话
      - openharness-config:/root/.openharness
      - ./OpenHarness/output_hyperprames/videos:/app/videos
      # QwenTTS 参考音频（宿主机目录 → 容器内只读），QWENTTS_REF_AUDIO 指向 /opt/tts-ref/ 下的文件
      - ${QWENTTS_REF_AUDIO_HOST_DIR:-./assets/tts-ref}:/opt/tts-ref:ro
    stdin_open: true
    tty: true
    shm_size: 256g
    ports:
      - "3000:3000"
      - "3001:3001"
      - "3002:3002"
      - "3003:3003"

  # ---- 交互终端 ----
  shell:
    extends: openharness
    container_name: openharness-shell-${OH_VERSION_HYPERFRAMES_VERSION:-v0.1.9_v0.7.77_v1.4_v2.1}
    entrypoint: ["bash"]

  # ---- PostgreSQL ----
  postgres:
    image: postgres:16-alpine
    container_name: openharness-postgres
    environment:
      POSTGRES_USER: oh
      POSTGRES_PASSWORD: oh
      POSTGRES_DB: oh
    volumes:
      - oh-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oh"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---- Redis ----
  redis:
    image: redis:7-alpine
    container_name: openharness-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - oh-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---- FastAPI 视频服务 ----
  api:
    extends: openharness
    container_name: openharness-api
    # 先跑 alembic 自动迁移再启动（幂等，已是 head 时秒过；失败则 fail-fast）
    entrypoint: ["bash", "-c", "cd /opt/oh-service && alembic upgrade head && exec oh-serve"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # !override 丢弃从 openharness 继承的 3000-3003（hyperframes preview 端口，
      # 优先归 session 使用），否则与 session 同时启动时宿主机端口冲突。
      !override
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - OH_DB_URL=postgresql+asyncpg://oh:oh@postgres:5432/oh
      - OH_DB_SYNC_URL=postgresql+psycopg://oh:oh@postgres:5432/oh
      - OH_DB_MIGRATION_URL=postgresql+asyncpg://oh:oh@postgres:5432/oh
      - OH_BROKER_URL=redis://redis:6379/0
      - OH_VIDEO_DIR=/var/openharness/videos
      - OH_WORKSPACE_ROOT=/workspaces
      - PRODUCER_HEADLESS_SHELL_PATH=/opt/chrome-headless-shell-linux64/chrome-headless-shell
      - CHROME_HEADLESS_BIN=/opt/chrome-headless-shell-linux64/chrome-headless-shell
      - OPENHARNESS_PERMISSION_MODE=full_auto
      - HYPERFRAMES_AUTO_UPDATE=false
      - HYPERFRAMES_NO_AUTO_INSTALL=1
      - HYPERFRAMES_NO_UPDATE_CHECK=1
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OH_CORS_ORIGINS=${OH_CORS_ORIGINS:-}
      # QwenTTS (本地 TTS 服务，Base 声音克隆) — 通过 .env 文件传入
      - QWENTTS_URL=${QWENTTS_URL:-}
      - QWENTTS_REF_AUDIO=${QWENTTS_REF_AUDIO:-}
      - QWENTTS_REF_TEXT=${QWENTTS_REF_TEXT:-}
      - QWENTTS_VOICE=${QWENTTS_VOICE:-}
      - QWENTTS_CLONE_SCRIPT=${QWENTTS_CLONE_SCRIPT:-}
    volumes:
      - ./OpenHarness/src:/app/src
      - ./OpenHarness/ohmo:/app/ohmo
      - ./service:/opt/oh-service
      - oh-videos:/var/openharness/videos
      - oh-workspaces:/workspaces
      - openharness-config:/root/.openharness
      # QwenTTS 参考音频（与 openharness 服务同源）
      - ${QWENTTS_REF_AUDIO_HOST_DIR:-./assets/tts-ref}:/opt/tts-ref:ro

  # ---- FastAPI 交互会话服务 (oh --backend-only 桥接) ----
  # 独立进程，复用同一 Postgres/Redis（Redis 用 db=1 避免与视频服务键空间冲突），
  # 共享 /workspaces 卷（会话快照冷态保留）。每个会话 spawn 一个 oh --backend-only。
  session:
    extends: openharness
    container_name: openharness-session
    # 镜像默认 workdir 是 /opt/oh-service（视频服务），必须切到挂载的
    # session-service 目录，否则 uvicorn 会导入错误的 app 包。
    working_dir: /opt/oh-session-service
    # 先跑 alembic 自动迁移再启动（独立 version table alembic_version_session，
    # 与 api 并发启动互不干扰；幂等，失败则 fail-fast）
    entrypoint: ["bash", "-c", "cd /opt/oh-session-service && alembic upgrade head && exec /root/.openharness-venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8001 --workers 1"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # 继承 openharness 的 3000-3003（hyperframes preview 端口，优先归 session，
      # 会话内 spawn 的 oh 跑 hyperframes preview 时可从宿主机访问），另加 8001。
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
      - OH_DB_URL=postgresql+asyncpg://oh:oh@postgres:5432/oh
      - OH_DB_SYNC_URL=postgresql+psycopg://oh:oh@postgres:5432/oh
      - OH_DB_MIGRATION_URL=postgresql+asyncpg://oh:oh@postgres:5432/oh
      # Redis db=1 — 与 api(db=0) 分离，避免键空间冲突。
      - OH_BROKER_URL=redis://redis:6379/1
      - OH_VIDEO_DIR=/var/openharness/videos
      - OH_WORKSPACE_ROOT=/workspaces
      - OH_NODE_ID=session
      - OH_NODE_BASE_URL=http://session:8001
      - OH_OH_BIN=/root/.local/bin/oh
      - PRODUCER_HEADLESS_SHELL_PATH=/opt/chrome-headless-shell-linux64/chrome-headless-shell
      - CHROME_HEADLESS_BIN=/opt/chrome-headless-shell-linux64/chrome-headless-shell
      - OPENHARNESS_PERMISSION_MODE=full_auto
      - HYPERFRAMES_AUTO_UPDATE=false
      - HYPERFRAMES_NO_AUTO_INSTALL=1
      - HYPERFRAMES_NO_UPDATE_CHECK=1
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OH_CORS_ORIGINS=${OH_CORS_ORIGINS:-}
    volumes:
      - ./OpenHarness/src:/app/src
      - ./OpenHarness/ohmo:/app/ohmo
      - ./session-service:/opt/oh-session-service
      - oh-videos:/var/openharness/videos
      - oh-workspaces:/workspaces
      - openharness-config:/root/.openharness

  # ---- 前端 SPA（独立镜像：Vite/React 构建 → nginx 提供静态资源 + 反向代理）----
  # nginx 将 /v1、/healthz 反代到 api:8000（同源，无需 CORS），SSE / Range 已特殊处理。
  # 访问 http://localhost:5173 即可使用前端。
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # 留空 => 前端走同源相对路径，由 nginx 反代到 api 服务。
        # 若前端与 API 部署在不同域名，可在此填写公网 API 地址。
        VITE_API_BASE: "${VITE_API_BASE:-}"
    image: openharness_hyperframes_web:${OH_VERSION_HYPERFRAMES_VERSION:-v0.1.9_v0.7.77_v1.4_v2.1}
    container_name: openharness-web
    environment:
      # Backend coordinates for the standalone nginx reverse-proxy.
      # Defaults match the compose services; override to point the
      # standalone frontend image at any external/remote backend.
      API_HOST: api
      API_PORT: "8000"
      SESSION_HOST: session
      SESSION_PORT: "8001"
    depends_on:
      - api
      - session
    ports:
      - "5173:80"
    restart: unless-stopped

  # Session Service 专用前端（Chat/Terminal 双模式，WS 流式 + 审批流）。
  # 启动：docker compose up -d --build session-frontend（会一并拉起 session 依赖）
  # 访问：http://localhost:5174（nginx 同源反代 REST + WebSocket 到 session:8001）
  session-frontend:
    build:
      context: ./session-frontend
      dockerfile: Dockerfile
    image: openharness_session_frontend:v0.1.0
    container_name: openharness-session-frontend
    environment:
      # Session-service coordinates for the standalone nginx reverse-proxy.
      # Defaults match the compose services; override to point the
      # standalone frontend image at any external/remote session-service.
      SESSION_HOST: session
      SESSION_PORT: "8001"
    depends_on:
      - session
    ports:
      - "5174:80"
    restart: unless-stopped

volumes:
  openharness-config:
    name: openharness-config
  oh-pg:
    name: openharness-pg
  oh-redis:
    name: openharness-redis
  oh-videos:
    name: openharness-videos
  oh-workspaces:
    name: openharness-workspaces
