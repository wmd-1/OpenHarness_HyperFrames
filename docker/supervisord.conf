[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
user=root

[program:api]
command=/root/.openharness-venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
directory=/opt/oh-service
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/api-stdout.log
stderr_logfile=/var/log/supervisor/api-stderr.log
environment=PYTHONPATH="/app/src:/opt/oh-service"

[program:worker]
; env-fallback（design D1）：OH_WORKER_QUEUES/OH_CELERY_CONCURRENCY 缺失时回退默认值，
; 与 e2e 的 oh-role 入口同构；exec 保证信号直达 celery 主进程。
command=/bin/bash -c 'exec /root/.openharness-venv/bin/celery -A app.workers.celery_app.celery_app worker -l info -c "${OH_CELERY_CONCURRENCY:-4}" -Q "${OH_WORKER_QUEUES:-high,normal,low}"'
directory=/opt/oh-service
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/worker-stdout.log
stderr_logfile=/var/log/supervisor/worker-stderr.log
environment=PYTHONPATH="/app/src:/opt/oh-service"

[program:beat]
command=/root/.openharness-venv/bin/celery -A app.workers.celery_app.celery_app beat -l info
directory=/opt/oh-service
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/beat-stdout.log
stderr_logfile=/var/log/supervisor/beat-stderr.log
environment=PYTHONPATH="/app/src:/opt/oh-service"

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface
